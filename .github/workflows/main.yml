name: Build CLI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64 musl (静态链接，无依赖)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: skill-garden
            dir: linux-x86_64
          # Linux ARM64 musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: skill-garden
            dir: linux-aarch64
          # macOS x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: skill-garden
            dir: macos-x86_64
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: skill-garden
            dir: macos-aarch64
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: skill-garden.exe
            dir: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux only)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install ARM64 cross-compiler (Linux ARM64 only)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --no-default-features --features cli --bin skill-garden --target ${{ matrix.target }}

      - name: Prepare artifact dir
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p "cli-dist/${VERSION}/${{ matrix.dir }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "cli-dist/${VERSION}/${{ matrix.dir }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-garden-${{ matrix.dir }}
          path: cli-dist/
